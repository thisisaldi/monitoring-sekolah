{% extends "base/base.html" %}

{% block title %}{{ title }} | Monitoring Keuangan Sekolah{% endblock %}
{% block page_heading %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-lg panel p-6">
    {% if school %}
    <p class="text-sm text-muted mb-4">Sekolah: <span class="font-medium text-ink">{{ school.name }}</span></p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">
            Simpan
        </button>
        <a href="{% url 'realizations:semester_list' %}" class="ml-2 link-muted">Batal</a>
    </form>
</div>
{% endblock %}
