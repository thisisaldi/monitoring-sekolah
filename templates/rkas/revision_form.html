{% extends "base/base.html" %}

{% block title %}{{ title }} | Monitoring Keuangan Sekolah{% endblock %}
{% block page_heading %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-lg panel p-6">
    <p class="text-sm text-muted mb-4">{{ rkas.school.name }} — {{ rkas.budget_year.name }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">
            Simpan
        </button>
        <a href="{% url 'rkas:detail' rkas.pk %}" class="ml-2 link-muted">Batal</a>
    </form>
</div>
{% endblock %}
